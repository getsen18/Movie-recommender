<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
  <title>Movie Matrix</title>
</head>

<body>

  <h1>Your Destination for The Perfect Info!!</h1>
  <h2>MOVIE MATRIX</h2>

  
  <div class="search-holder">
    <input
      id="searchInput"
      class="search"
      type="text"
      placeholder="Movie on your mind?"
    >

    <button id="searchBtn">
      <img class="icon" src="search icon.png">
    </button>
  </div>


  <div class="moody">
    <div class="moodi">
      <input
        type="text"
        id="moodInput"
        class="mood"
        placeholder="Lets dig in by your mood?"
      >
      <button id="moodBtn">Find</button>
      <p>Come on enter whats your mood like rn?</p>
    </div>
  </div>

 
  <div id="moviesContainer"></div>

<div id="similarMovies"></div>

  <script src="script.js"></script>
</body>
</html>
